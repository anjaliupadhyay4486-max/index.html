<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kashyap Mart - Online Shopping</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #e3e6e6;
      color: #0f1111;
    }

    /* Header / Navbar */
    header {
      background-color: #131921;
      color: white;
      padding: 10px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
      position: sticky;
      top: 0;
      z-index: 100;
      flex-wrap: wrap;
    }

    .logo {
      font-size: 1.6rem;
      font-weight: 800;
      color: #ffffff;
      text-decoration: none;
      letter-spacing: 0.5px;
      cursor: pointer;
    }

    .logo span {
      color: #febd69;
    }

    .search-container {
      flex: 1;
      max-width: 650px;
      display: flex;
      border-radius: 6px;
      overflow: hidden;
      background: white;
    }

    .search-container input {
      width: 100%;
      padding: 10px 14px;
      border: none;
      outline: none;
      font-size: 1rem;
    }

    .search-container button {
      background-color: #febd69;
      border: none;
      padding: 0 18px;
      cursor: pointer;
      font-size: 1.1rem;
      font-weight: bold;
      color: #131921;
    }

    .search-container button:hover {
      background-color: #f3a847;
    }

    .cart-btn {
      background: transparent;
      border: 1px solid transparent;
      color: white;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      padding: 8px 12px;
      border-radius: 4px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .cart-btn:hover {
      border-color: white;
    }

    .cart-count {
      background-color: #f08804;
      color: #131921;
      padding: 2px 7px;
      border-radius: 50%;
      font-size: 0.9rem;
    }

    /* Sub-navbar Categories */
    .sub-nav {
      background-color: #232f3e;
      padding: 8px 20px;
      display: flex;
      gap: 12px;
      overflow-x: auto;
    }

    .cat-btn {
      background: transparent;
      border: 1px solid transparent;
      color: white;
      padding: 5px 12px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.9rem;
      white-space: nowrap;
    }

    .cat-btn:hover, .cat-btn.active {
      border-color: white;
      background-color: rgba(255, 255, 255, 0.1);
    }

    /* Hero Banner */
    .hero {
      background: linear-gradient(to right, #232f3e, #37475a);
      color: white;
      text-align: center;
      padding: 32px 20px;
    }

    .hero h1 {
      font-size: 1.9rem;
      margin-bottom: 8px;
    }

    .hero p {
      color: #febd69;
      font-size: 1.05rem;
    }

    /* Main Product Grid */
    .container {
      max-width: 1250px;
      margin: 20px auto;
      padding: 0 15px;
    }

    .products-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 20px;
    }

    .card {
      background: white;
      border-radius: 6px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      box-shadow: 0 2px 6px rgba(0,0,0,0.08);
      transition: transform 0.2s;
    }

    .card:hover {
      transform: translateY(-3px);
    }

    .card img {
      width: 100%;
      height: 200px;
      object-fit: cover;
      border-radius: 4px;
      margin-bottom: 12px;
      background-color: #f7f7f7;
    }

    .card-category {
      font-size: 0.78rem;
      color: #565959;
      text-transform: uppercase;
      margin-bottom: 4px;
    }

    .card-title {
      font-size: 1.05rem;
      font-weight: 600;
      margin-bottom: 6px;
      line-height: 1.3;
    }

    .rating {
      color: #ffa41c;
      font-size: 0.9rem;
      margin-bottom: 8px;
    }

    .price {
      font-size: 1.35rem;
      font-weight: 700;
      color: #0f1111;
      margin-bottom: 12px;
    }

    .price span {
      font-size: 0.85rem;
      font-weight: 400;
      color: #565959;
      text-decoration: line-through;
      margin-left: 6px;
    }

    .add-btn {
      background-color: #ffd814;
      border: 1px solid #fcd200;
      border-radius: 20px;
      padding: 9px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
    }

    .add-btn:hover {
      background-color: #f7ca00;
    }

    .no-results {
      text-align: center;
      padding: 50px 20px;
      font-size: 1.2rem;
      color: #565959;
      display: none;
    }

    /* Cart Sidebar Modal */
    .cart-modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.55);
      z-index: 200;
      justify-content: flex-end;
    }

    .cart-panel {
      background: white;
      width: 100%;
      max-width: 380px;
      height: 100%;
      padding: 20px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .cart-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #ddd;
      padding-bottom: 12px;
    }

    .close-cart {
      background: none;
      border: none;
      font-size: 1.5rem;
      cursor: pointer;
    }

    .cart-items {
      flex: 1;
      overflow-y: auto;
      margin: 15px 0;
    }

    .cart-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px solid #eee;
      gap: 10px;
    }

    .cart-item img {
      width: 50px;
      height: 50px;
      object-fit: cover;
      border-radius: 4px;
    }

    .remove-btn {
      color: #b12704;
      background: none;
      border: none;
      cursor: pointer;
      font-size: 0.85rem;
    }

    .cart-footer {
      border-top: 1px solid #ddd;
      padding-top: 15px;
    }

    .checkout-btn {
      background-color: #ffa41c;
      border: none;
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      margin-top: 10px;
    }

    footer {
      background-color: #131921;
      color: #ddd;
      text-align: center;
      padding: 20px;
      margin-top: 40px;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>

  <!-- Top Navbar -->
  <header>
    <div class="logo" onclick="resetFilters()">Kashyap<span>Mart</span>.in</div>
    <div class="search-container">
      <input type="text" id="searchInput" placeholder="Search Kashyap Mart (e.g. Watch, Shoes, Laptop, Headphones)..." onkeyup="filterProducts()" />
      <button onclick="filterProducts()">Search</button>
    </div>
    <button class="cart-btn" onclick="toggleCart()">
      🛒 Cart <span class="cart-count" id="cartCount">0</span>
    </button>
  </header>

  <!-- Category Bar -->
  <div class="sub-nav">
    <button class="cat-btn active" onclick="filterCategory('All', this)">All Items</button>
    <button class="cat-btn" onclick="filterCategory('Electronics', this)">Electronics</button>
    <button class="cat-btn" onclick="filterCategory('Fashion', this)">Fashion & Shoes</button>
    <button class="cat-btn" onclick="filterCategory('Home', this)">Home & Kitchen</button>
    <button class="cat-btn" onclick="filterCategory('Accessories', this)">Watches & Bags</button>
  </div>

  <!-- Hero Banner -->
  <section class="hero">
    <h1>Welcome to Kashyap Mart</h1>
    <p>Great Indian Deals • Fast Delivery • Top Quality Products</p>
  </section>

  <!-- Product Grid -->
  <main class="container">
    <div class="products-grid" id="productsGrid"></div>
    <div class="no-results" id="noResults">Koi item nahi mila. Kuch aur search karein!</div>
  </main>

  <!-- Cart Drawer -->
  <div class="cart-modal" id="cartModal">
    <div class="cart-panel">
      <div class="cart-header">
        <h2>Your Shopping Cart</h2>
        <button class="close-cart" onclick="toggleCart()">&times;</button>
      </div>
      <div class="cart-items" id="cartItems">
        <p style="color:#565959;">Aapka cart abhi khaali hai.</p>
      </div>
      <div class="cart-footer">
        <h3>Subtotal: ₹<span id="cartTotal">0</span></h3>
        <button class="checkout-btn" onclick="checkout()">Proceed to Buy</button>
      </div>
    </div>
  </div>

  <footer>
    &copy; 2026 Kashyap Mart. All Rights Reserved.
  </footer>

  <script>
    const products = [
      {
        id: 1,
        name: "Wireless Noise Cancelling Headphones",
        category: "Electronics",
        price: 2499,
        mrp: 4999,
        rating: "★★★★☆ (1,240)",
        image: "https://images.unsplash.com/photo-1505740420928-5e560c06d30e?auto=format&fit=crop&w=500&q=80"
      },
      {
        id: 2,
        name: "Smart Fitness Watch Pro",
        category: "Accessories",
        price: 1999,
        mrp: 3999,
        rating: "★★★★★ (890)",
        image: "https://images.unsplash.com/photo-1523275335684-37898b6baf30?auto=format&fit=crop&w=500&q=80"
      },
      {
        id: 3,
        name: "Men's Running Sports Shoes",
        category: "Fashion",
        price: 1499,
        mrp: 2999,
        rating: "★★★★☆ (650)",
        image: "https://images.unsplash.com/photo-1542291026-7eec264c27ff?auto=format&fit=crop&w=500&q=80"
      },
      {
        id: 4,
        name: "UltraBook Pro 15-inch Laptop",
        category: "Electronics",
        price: 54990,
        mrp: 68990,
        rating: "★★★★★ (430)",
        image: "https://images.unsplash.com/photo-1496181133206-80ce9b88a853?auto=format&fit=crop&w=500&q=80"
      },
      {
        id: 5,
        name: "Travel Waterproof Backpack",
        category: "Accessories",
        price: 899,
        mrp: 1799,
        rating: "★★★★☆ (1,120)",
        image: "https://images.unsplash.com/photo-1553062407-98eeb64c6a62?auto=format&fit=crop&w=500&q=80"
      },
      {
        id: 6,
        name: "Automatic Espresso Coffee Maker",
        category: "Home",
        price: 3499,
        mrp: 5999,
        rating: "★★★★☆ (310)",
        image: "https://images.unsplash.com/photo-1517668808822-9ebb02f2a0e6?auto=format&fit=crop&w=500&q=80"
      },
      {
        id: 7,
        name: "Classic Aviator Sunglasses",
        category: "Fashion",
        price: 699,
        mrp: 1499,
        rating: "★★★★☆ (540)",
        image: "https://images.unsplash.com/photo-1572635196237-14b3f281503f?auto=format&fit=crop&w=500&q=80"
      },
      {
        id: 8,
        name: "Portable Bluetooth Bass Speaker",
        category: "Electronics",
        price: 1299,
        mrp: 2499,
        rating: "★★★★★ (980)",
        image: "https://images.unsplash.com/photo-1608043152269-423dbba4e7e1?auto=format&fit=crop&w=500&q=80"
      }
    ];

    let selectedCategory = "All";
    let cart = [];

    function renderProducts(list) {
      const grid = document.getElementById("productsGrid");
      const noResults = document.getElementById("noResults");
      grid.innerHTML = "";

      if (list.length === 0) {
        noResults.style.display = "block";
        return;
      } else {
        noResults.style.display = "none";
      }

      list.forEach(item => {
        const card = document.createElement("div");
        card.className = "card";
        card.innerHTML = `
          <div>
            <img src="${item.image}" alt="${item.name}" />
            <div class="card-category">${item.category}</div>
            <div class="card-title">${item.name}</div>
            <div class="rating">${item.rating}</div>
            <div class="price">₹${item.price.toLocaleString("en-IN")} <span>₹${item.mrp.toLocaleString("en-IN")}</span></div>
          </div>
          <button class="add-btn" onclick="addToCart(${item.id})">Add to Cart</button>
        `;
        grid.appendChild(card);
      });
    }

    function filterProducts() {
      const query = document.getElementById("searchInput").value.toLowerCase().trim();
      const filtered = products.filter(item => {
        const matchesCategory = selectedCategory === "All" || item.category === selectedCategory;
        const matchesSearch = item.name.toLowerCase().includes(query) || item.category.toLowerCase().includes(query);
        return matchesCategory && matchesSearch;
      });
      renderProducts(filtered);
    }

    function filterCategory(category, btn) {
      selectedCategory = category;
      document.querySelectorAll(".cat-btn").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      filterProducts();
    }

    function resetFilters() {
      document.getElementById("searchInput").value = "";
      selectedCategory = "All";
      document.querySelectorAll(".cat-btn").forEach(b => b.classList.remove("active"));
      document.querySelector(".cat-btn").classList.add("active");
      renderProducts(products);
    }

    function addToCart(id) {
      const product = products.find(p => p.id === id);
      cart.push(product);
      updateCartUI();
    }

    function removeFromCart(index) {
      cart.splice(index, 1);
      updateCartUI();
    }

    function updateCartUI() {
      document.getElementById("cartCount").innerText = cart.length;
      const cartItemsDiv = document.getElementById("cartItems");
      const cartTotalSpan = document.getElementById("cartTotal");

      if (cart.length === 0) {
        cartItemsDiv.innerHTML = '<p style="color:#565959;">Aapka cart abhi khaali hai.</p>';
        cartTotalSpan.innerText = "0";
        return;
      }

      let total = 0;
      cartItemsDiv.innerHTML = "";
      cart.forEach((item, index) => {
        total += item.price;
        cartItemsDiv.innerHTML += `
          <div class="cart-item">
            <img src="${item.image}" alt="${item.name}" />
            <div style="flex:1;">
              <div style="font-size:0.9rem; font-weight:600;">${item.name}</div>
              <div style="font-size:0.85rem; color:#b12704;">₹${item.price.toLocaleString("en-IN")}</div>
            </div>
            <button class="remove-btn" onclick="removeFromCart(${index})">Remove</button>
          </div>
        `;
      });

      cartTotalSpan.innerText = total.toLocaleString("en-IN");
    }

    function toggleCart() {
      const modal = document.getElementById("cartModal");
      modal.style.display = modal.style.display === "flex" ? "none" : "flex";
    }

    function checkout() {
      if (cart.length === 0) {
        alert("Pehle cart mein kuch items add karein!");
        return;
      }
      alert("Thank you for shopping at Kashyap Mart! Aapka order place ho gaya hai.");
      cart = [];
      updateCartUI();
      toggleCart();
    }

    // Initial load
    renderProducts(products);
  </script>
</body>
</html>
